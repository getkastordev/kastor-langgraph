version: 2

builds:
  - id: kastor-langgraph
    main: ./cmd/kastor-langgraph
    binary: kastor-langgraph
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X github.com/getkastordev/kastor-langgraph/internal/plugin.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
